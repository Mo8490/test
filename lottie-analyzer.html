<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lottie Animation Analyzer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #00d4ff;
        }
        .upload-area {
            border: 2px dashed #00d4ff;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            margin-bottom: 20px;
            transition: background 0.3s;
        }
        .upload-area:hover {
            background: rgba(0, 212, 255, 0.1);
        }
        .upload-area input {
            display: none;
        }
        .upload-area label {
            cursor: pointer;
            font-size: 18px;
        }
        .info-panel {
            background: #16213e;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .info-panel h3 {
            color: #00d4ff;
            margin-bottom: 10px;
        }
        .preview-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .preview-box {
            background: #16213e;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }
        .preview-box h4 {
            color: #00d4ff;
            margin-bottom: 10px;
        }
        .animation-preview {
            width: 200px;
            height: 200px;
            background: #0f0f23;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .animation-preview img {
            max-width: 100%;
            max-height: 100%;
        }
        .frames-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 10px;
            background: #16213e;
            border-radius: 12px;
            padding: 20px;
        }
        .frame-item {
            background: #0f0f23;
            border-radius: 8px;
            padding: 5px;
            text-align: center;
        }
        .frame-item img {
            width: 60px;
            height: 60px;
            object-fit: contain;
        }
        .frame-item span {
            display: block;
            font-size: 10px;
            color: #888;
            margin-top: 4px;
        }
        .controls {
            background: #16213e;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .controls button {
            background: #00d4ff;
            color: #1a1a2e;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            margin-right: 10px;
            font-weight: bold;
        }
        .controls button:hover {
            background: #00b8e6;
        }
        .slider-container {
            margin-top: 15px;
        }
        .slider-container label {
            display: block;
            margin-bottom: 5px;
        }
        .slider-container input[type="range"] {
            width: 100%;
        }
        #exportCode {
            background: #16213e;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            display: none;
        }
        #exportCode h3 {
            color: #00d4ff;
            margin-bottom: 10px;
        }
        #exportCode pre {
            background: #0f0f23;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 12px;
        }
        .copy-btn {
            background: #00d4ff !important;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Lottie Animation Analyzer</h1>

        <div class="upload-area">
            <input type="file" id="fileInput" accept=".json">
            <label for="fileInput">
                📁 Drop Lottie JSON file here or click to upload
            </label>
        </div>

        <div class="info-panel" id="infoPanel" style="display: none;">
            <h3>Animation Info</h3>
            <div id="animationInfo"></div>
        </div>

        <div class="preview-container" id="previewContainer" style="display: none;">
            <div class="preview-box">
                <h4>Live Preview</h4>
                <div class="animation-preview">
                    <img id="livePreview" src="" alt="Preview">
                </div>
            </div>
            <div class="preview-box">
                <h4>Animation Controls</h4>
                <div class="controls">
                    <button onclick="playAnimation()">▶ Play</button>
                    <button onclick="pauseAnimation()">⏸ Pause</button>
                    <button onclick="resetAnimation()">⏮ Reset</button>
                    <div class="slider-container">
                        <label>Speed: <span id="speedValue">1x</span></label>
                        <input type="range" id="speedSlider" min="0.1" max="3" step="0.1" value="1" onchange="updateSpeed()">
                    </div>
                    <div class="slider-container">
                        <label>Frame: <span id="frameValue">0</span></label>
                        <input type="range" id="frameSlider" min="0" max="100" value="0" onchange="seekFrame()">
                    </div>
                </div>
            </div>
        </div>

        <div id="framesSection" style="display: none;">
            <h3 style="color: #00d4ff; margin-bottom: 15px;">Extracted Frames</h3>
            <div class="frames-grid" id="framesGrid"></div>
        </div>

        <div id="exportCode">
            <h3>Generated CSS Animation Code</h3>
            <pre id="generatedCode"></pre>
            <button class="copy-btn" onclick="copyCode()">📋 Copy Code</button>
        </div>
    </div>

    <script>
        let lottieData = null;
        let frames = [];
        let currentFrame = 0;
        let animationInterval = null;
        let fps = 60;
        let speedMultiplier = 1;

        document.getElementById('fileInput').addEventListener('change', handleFile);

        function handleFile(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    lottieData = JSON.parse(event.target.result);
                    analyzeAnimation();
                } catch (err) {
                    alert('Invalid JSON file: ' + err.message);
                }
            };
            reader.readAsText(file);
        }

        function analyzeAnimation() {
            if (!lottieData) return;

            // Extract info
            const info = {
                version: lottieData.v || 'Unknown',
                name: lottieData.nm || 'Unnamed',
                frameRate: lottieData.fr || 60,
                inPoint: lottieData.ip || 0,
                outPoint: lottieData.op || 0,
                width: lottieData.w || 0,
                height: lottieData.h || 0,
                totalFrames: (lottieData.op || 0) - (lottieData.ip || 0),
                duration: ((lottieData.op - lottieData.ip) / lottieData.fr).toFixed(2) + 's'
            };

            fps = info.frameRate;

            // Display info
            document.getElementById('infoPanel').style.display = 'block';
            document.getElementById('animationInfo').innerHTML = `
                <p><strong>Name:</strong> ${info.name}</p>
                <p><strong>Version:</strong> ${info.version}</p>
                <p><strong>Dimensions:</strong> ${info.width} x ${info.height}</p>
                <p><strong>Frame Rate:</strong> ${info.frameRate} fps</p>
                <p><strong>Duration:</strong> ${info.duration} (${info.totalFrames} frames)</p>
            `;

            // Extract frames from assets
            frames = [];
            if (lottieData.assets) {
                lottieData.assets.forEach(asset => {
                    if (asset.p && asset.p.startsWith('data:image')) {
                        frames.push({
                            id: asset.id,
                            data: asset.p,
                            width: asset.w,
                            height: asset.h
                        });
                    }
                });
            }

            if (frames.length > 0) {
                displayFrames();
                document.getElementById('previewContainer').style.display = 'flex';
                document.getElementById('frameSlider').max = frames.length - 1;
                playAnimation();
                generateCSSCode();
            }
        }

        function displayFrames() {
            const grid = document.getElementById('framesGrid');
            grid.innerHTML = '';

            frames.forEach((frame, index) => {
                const item = document.createElement('div');
                item.className = 'frame-item';
                item.innerHTML = `
                    <img src="${frame.data}" alt="Frame ${index}">
                    <span>Frame ${index}</span>
                `;
                item.onclick = () => {
                    currentFrame = index;
                    updatePreview();
                };
                grid.appendChild(item);
            });

            document.getElementById('framesSection').style.display = 'block';
        }

        function updatePreview() {
            if (frames.length === 0) return;
            document.getElementById('livePreview').src = frames[currentFrame].data;
            document.getElementById('frameSlider').value = currentFrame;
            document.getElementById('frameValue').textContent = currentFrame;
        }

        function playAnimation() {
            pauseAnimation();
            const interval = 1000 / (fps * speedMultiplier);
            animationInterval = setInterval(() => {
                currentFrame = (currentFrame + 1) % frames.length;
                updatePreview();
            }, interval);
        }

        function pauseAnimation() {
            if (animationInterval) {
                clearInterval(animationInterval);
                animationInterval = null;
            }
        }

        function resetAnimation() {
            currentFrame = 0;
            updatePreview();
        }

        function updateSpeed() {
            speedMultiplier = parseFloat(document.getElementById('speedSlider').value);
            document.getElementById('speedValue').textContent = speedMultiplier.toFixed(1) + 'x';
            if (animationInterval) {
                playAnimation();
            }
        }

        function seekFrame() {
            currentFrame = parseInt(document.getElementById('frameSlider').value);
            updatePreview();
        }

        function generateCSSCode() {
            if (frames.length === 0) return;

            const duration = frames.length / fps;
            const keyframeStep = 100 / frames.length;

            let cssCode = `/* Animated Loader - ${frames.length} Frames at ${fps}fps */
/* Duration: ${duration.toFixed(2)}s */

.animated-loader {
    width: ${lottieData.w || 120}px;
    height: ${lottieData.h || 120}px;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    animation: loader-frames ${duration.toFixed(2)}s steps(1) infinite;
}

@keyframes loader-frames {
`;

            frames.forEach((frame, index) => {
                const percent = (index * keyframeStep).toFixed(2);
                cssCode += `    ${percent}% { background-image: url("${frame.data.substring(0, 50)}..."); }\n`;
            });

            cssCode += `}

/* HTML Usage:
<div class="animated-loader"></div>
*/`;

            document.getElementById('generatedCode').textContent = cssCode;
            document.getElementById('exportCode').style.display = 'block';
        }

        function copyCode() {
            const code = document.getElementById('generatedCode').textContent;
            navigator.clipboard.writeText(code).then(() => {
                alert('Code copied to clipboard!');
            });
        }
    </script>
</body>
</html>
