<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <style>
    .s { animation: m 2s steps(9) infinite; }
    @keyframes m { to { transform: translateX(-1080px); } }
  </style>
  <clipPath id="c"><rect width="120" height="120"/></clipPath>
  <g clip-path="url(#c)">
    <image class="s" href="data:image/webp;base64," width="1080" height="120"/>
  </g>
</svg>