            padding: 40px;

            text-align: center;
            color: #00d4ff;
            margin-bottom: 40px;

            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
            align-items: flex-end;

            background: #12122a;
            border-radius: 16px;
            padding: 20px;
            text-align: center;

            color: #00d4ff;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

            color: #888;
            font-size: 0.85rem;
            margin-top: 10px;
        }
        .preview {
            margin: 15px auto;
            background: #000;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }
