    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: #0a0a1a;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            color: #e0e0e0;
            padding: 30px;
        }
        h1 { text-align: center; color: #00d4ff; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #888; margin-bottom: 40px; }
        .subtitle span { color: #00ff88; font-weight: bold; }
        
        .row {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-end;
            max-width: 1400px;
            margin: 0 auto 30px;
        }
        
        .card {
            background: #12122a;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            min-width: 160px;
        }
        .card.highlight {
            border: 2px solid #00ff88;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.3);
        }
        
        .px-label { color: #00d4ff; font-size: 1.8rem; font-weight: bold; }
        .info { color: #666; font-size: 0.8rem; margin: 5px 0 15px; }
        .kb { color: #00ff88; font-size: 1.4rem; font-weight: bold; margin-top: 15px; }
        
        .preview {
            background: #000;
            border-radius: 16px;
            margin: 10px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .btn {
            margin-top: 12px;
            padding: 10px 18px;
            background: #00d4ff;
            color: #000;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn:hover { background: #00ff88; }
