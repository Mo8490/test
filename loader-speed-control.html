<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تنظیم سرعت لودر</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: #0a0a1a;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            color: #e0e0e0;
            padding: 30px;
        }
        h1 { text-align: center; color: #00d4ff; margin-bottom: 30px; }
        
        .speed-control {
            max-width: 500px;
            margin: 0 auto 40px;
            background: #12122a;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
        }
        .speed-label {
            color: #00d4ff;
            font-size: 1.2rem;
            margin-bottom: 15px;
        }
        .speed-value {
            color: #00ff88;
            font-size: 3rem;
            font-weight: bold;
            margin: 20px 0;
        }
        .speed-slider {
            width: 100%;
            height: 12px;
            -webkit-appearance: none;
            background: #333;
            border-radius: 6px;
            outline: none;
            margin: 20px 0;
        }
        .speed-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, #00d4ff, #00ff88);
            border-radius: 50%;
            cursor: pointer;
        }
        .speed-slider::-moz-range-thumb {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, #00d4ff, #00ff88);
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }
        
        .presets {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        .preset-btn {
            padding: 10px 20px;
            background: transparent;
            border: 2px solid #444;
            color: #888;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        .preset-btn:hover { border-color: #00d4ff; color: #00d4ff; }
        .preset-btn.active { 
            background: #00d4ff; 
            color: #000; 
            border-color: #00d4ff;
            font-weight: bold;
        }
        
        .grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            align-items: flex-end;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .card {
            background: #12122a;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
        }
        .card-title { color: #00d4ff; font-size: 1.4rem; font-weight: bold; }
        .card-info { color: #666; font-size: 0.85rem; margin: 5px 0 15px; }
        .card-kb { color: #00ff88; font-size: 1.2rem; font-weight: bold; margin-top: 15px; }
        
        .preview {
            background: #000;
            border-radius: 12px;
            margin: 10px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .copy-btn {
            margin-top: 12px;
            padding: 10px 20px;
            background: #00d4ff;
            color: #000;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }
        .copy-btn:hover { background: #00ff88; }

        function setSpeed(speed) {
            slider.value = speed;
            updateSpeed();
            
            document.querySelectorAll('.preset-btn').forEach(btn => {
                btn.classList.remove('active');
                if (
                    (speed === 0.5 && btn.textContent.includes('خیلی سریع')) ||
                    (speed === 1 && btn.textContent === 'سریع') ||
                    (speed === 2 && btn.textContent === 'معمولی') ||
                    (speed === 3 && btn.textContent === 'آهسته') ||
                    (speed === 4 && btn.textContent.includes('خیلی آهسته'))
                ) {
                    btn.classList.add('active');
                }
            });
        }
        
        function updateSpeed() {
            const speed = parseFloat(slider.value);
            valueDisplay.textContent = speed.toFixed(1);
            document.documentElement.style.setProperty('--speed', speed + 's');
        }
        
        slider.addEventListener('input', () => {
            updateSpeed();
            document.querySelectorAll('.preset-btn').forEach(btn => btn.classList.remove('active'));
        });
        
        function copyCSS(size, frames, sw) {
            const speed = parseFloat(slider.value);
            const data = loaderData[size];
            
            const css = `.wallet-loader {
    width: ${size}px;
    height: ${size}px;
    background-image: url("${data.b64}");
    background-size: ${frames * 100}% 100%;
    animation: wallet-sprite ${speed}s steps(${frames}) infinite;
}

@keyframes wallet-sprite {
    to { background-position: -${sw}px 0; }
}`;
            
            navigator.clipboard.writeText(css).then(() => {
                alert('✅ CSS با سرعت ' + speed + 's کپی شد!');
            });
        }
        
        // Initialize
        updateSpeed();
    </script>
