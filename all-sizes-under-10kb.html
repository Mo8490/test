<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لودرهای زیر 10KB - همه سایزها</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(180deg, #0a0a1a 0%, #0f1525 100%);
            font-family: 'Segoe UI', Tahoma, sans-serif;
            color: #e0e0e0;
            padding: 30px;
        }
        h1 { text-align: center; color: #00d4ff; margin-bottom: 5px; font-size: 2rem; }
        .subtitle { text-align: center; color: #666; margin-bottom: 40px; }
        .subtitle span { color: #00ff88; }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .card {
            background: rgba(18, 18, 42, 0.9);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(0, 212, 255, 0.1);
            transition: all 0.3s;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 212, 255, 0.2);
            border-color: rgba(0, 212, 255, 0.3);
        }
        .card.big {
            border: 2px solid #00ff88;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.2);
        }
        
        .size-badge {
            background: linear-gradient(135deg, #00d4ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.2rem;
            font-weight: bold;
        }
        .info { color: #888; font-size: 0.85rem; margin: 8px 0; }
        .kb-size { 
            color: #00ff88; 
            font-size: 1.5rem; 
            font-weight: bold;
            margin-top: 10px;
        }
        
        .preview {
            background: #000;
            border-radius: 16px;
            margin: 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .copy-btn {
            margin-top: 12px;
            padding: 10px 20px;
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            color: #000;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        .copy-btn:hover { 
            background: linear-gradient(135deg, #00ff88 0%, #00cc66 100%);
        }
        
        .footer {
            max-width: 800px;
            margin: 50px auto;
            text-align: center;
            color: #666;
        }
        .footer .highlight { color: #00ff88; font-weight: bold; }
