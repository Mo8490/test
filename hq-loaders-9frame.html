<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لودرهای 9 فریم با کیفیت بالا</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: #0a0a1a;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            color: #e0e0e0;
            padding: 30px;
        }
        h1 { text-align: center; color: #00d4ff; margin-bottom: 10px; }
        .sub { text-align: center; color: #888; margin-bottom: 30px; }
        .sub b { color: #00ff88; }
        
        .speed-box {
            max-width: 450px;
            margin: 0 auto 40px;
            background: #12122a;
            border-radius: 16px;
            padding: 25px;
            text-align: center;
        }
        .speed-title { color: #00d4ff; margin-bottom: 15px; }
        .speed-val { color: #00ff88; font-size: 2.5rem; font-weight: bold; margin: 15px 0; }
        .slider {
            width: 100%;
            height: 10px;
            -webkit-appearance: none;
            background: #333;
            border-radius: 5px;
            outline: none;
        }
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            background: #00ff88;
            border-radius: 50%;
            cursor: pointer;
        }
        .presets {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 15px;
        }
        .preset {
            padding: 8px 16px;
            background: transparent;
            border: 1px solid #444;
            color: #888;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .preset:hover { border-color: #00d4ff; color: #00d4ff; }
        .preset.on { background: #00d4ff; color: #000; border-color: #00d4ff; }
        
        .grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            align-items: flex-end;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .card {
            background: #12122a;
            border-radius: 16px;
            padding: 18px;
            text-align: center;
        }
        .sz { color: #00d4ff; font-size: 1.5rem; font-weight: bold; }
        .info { color: #666; font-size: 0.8rem; margin: 5px 0 12px; }
        .kb { color: #00ff88; font-size: 1.2rem; font-weight: bold; margin-top: 12px; }
        
        .pv {
            background: #000;
            border-radius: 12px;
            margin: 10px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .btn {
            margin-top: 10px;
            padding: 8px 16px;
            background: #00d4ff;
            color: #000;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
        }
        .btn:hover { background: #00ff88; }

        const sl = document.getElementById('sl');
        const sv = document.getElementById('sv');
        
        function sp(v) {
            sl.value = v;
            upd();
            document.querySelectorAll('.preset').forEach(b => {
                b.classList.toggle('on', parseFloat(b.textContent) === v);
            });
        }
        
        function upd() {
            const v = parseFloat(sl.value);
            sv.textContent = v.toFixed(1);
            document.documentElement.style.setProperty('--spd', v + 's');
        }
        
        sl.addEventListener('input', () => {
            upd();
            document.querySelectorAll('.preset').forEach(b => b.classList.remove('on'));
        });
        
        function cp(size, sw) {
            const v = parseFloat(sl.value);
            const css = `.wallet-loader {
    width: ${size}px;
    height: ${size}px;
    background-image: url("${data[size]}");
    background-size: 900% 100%;
    animation: wallet-sprite ${v}s steps(9) infinite;
}

@keyframes wallet-sprite {
    to { background-position: -${sw}px 0; }
}`;
            navigator.clipboard.writeText(css).then(() => alert('✅ کپی شد!'));
        }
        
        upd();
    </script>
