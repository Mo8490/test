<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet Loader - Exact Lottie Recreation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #0a0a12;
            font-family: system-ui, -apple-system, sans-serif;
            gap: 40px;
        }

        h1 {
            color: #fff;
            font-weight: 300;
            font-size: 20px;
        }

        .demo-row {
            display: flex;
            gap: 40px;
            align-items: center;
        }

        .demo-box {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 30px;
            text-align: center;
        }

        .demo-box p {
            color: #555;
            margin-top: 15px;
            font-size: 12px;
        }

        /* ============================================
           WALLET LOADER - EXACT LOTTIE RECREATION
           بازسازی دقیق فریم به فریم
           ============================================ */

        .wallet-loader {
            --size: 120px;
            --duration: 2.5s;
            width: var(--size);
            height: var(--size);
            position: relative;
        }

        .wallet-loader svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        /* === نیمه چپ === */
        .half-left {
            transform-origin: 60px 60px;
            animation: leftHalfAnim var(--duration) ease-in-out infinite;
        }

        /* === نیمه راست === */
        .half-right {
            transform-origin: 60px 60px;
            animation: rightHalfAnim var(--duration) ease-in-out infinite;
        }

        /* === پوشش آبی نیمه چپ === */
        .blue-overlay-left {
            animation: blueOverlayLeftAnim var(--duration) ease-in-out infinite;
        }

        /* === پوشش آبی نیمه راست === */
        .blue-overlay-right {
            animation: blueOverlayRightAnim var(--duration) ease-in-out infinite;
        }

        /* === خط صورتی وسط === */
        .center-line {
            opacity: 0;
            animation: centerLineAnim var(--duration) ease-in-out infinite;
        }

        /* === سکه === */
        .coin-group {
            transform-origin: 60px 60px;
            animation: coinAnim var(--duration) ease-in-out infinite;
        }

        /* ============================================
           KEYFRAMES - دقیقاً مثل انیمیشن Lottie
           ============================================ */

        /*
        تایم‌لاین انیمیشن:
        0-5%    : حالت عادی (آبی + سکه)
        5-15%   : رنگین‌کمان ظاهر میشه
        15-25%  : دو نیمه از هم جدا میشن
        25-35%  : نیمه راست می‌چرخه (180 درجه)
        35-50%  : دو نیمه به هم نزدیک میشن، رنگ آبی برمیگرده
        50-60%  : دوباره از هم جدا میشن با خط صورتی
        60-75%  : به هم می‌چسبن
        75-100% : حالت عادی
        */

        @keyframes leftHalfAnim {
            0%, 5% {
                transform: translateX(0);
            }
            18%, 25% {
                transform: translateX(-20px);
            }
            35%, 50% {
                transform: translateX(0);
            }
            55%, 62% {
                transform: translateX(-15px);
            }
            75%, 100% {
                transform: translateX(0);
            }
        }

        @keyframes rightHalfAnim {
            0%, 5% {
                transform: translateX(0) rotate(0deg);
            }
            18%, 22% {
                transform: translateX(20px) rotate(0deg);
            }
            28% {
                transform: translateX(15px) rotate(90deg);
            }
            35% {
                transform: translateX(5px) rotate(180deg);
            }
            42%, 50% {
                transform: translateX(0) rotate(0deg);
            }
            55%, 62% {
                transform: translateX(15px) rotate(0deg);
            }
            75%, 100% {
                transform: translateX(0) rotate(0deg);
            }
        }

        @keyframes blueOverlayLeftAnim {
            0%, 3% {
                opacity: 1;
            }
            8%, 32% {
                opacity: 0;
            }
            42%, 100% {
                opacity: 1;
            }
        }

        @keyframes blueOverlayRightAnim {
            0%, 3% {
                opacity: 1;
            }
            8%, 38% {
                opacity: 0;
            }
            48%, 100% {
                opacity: 1;
            }
        }

        @keyframes centerLineAnim {
            0%, 50% {
                opacity: 0;
            }
            55%, 68% {
                opacity: 1;
            }
            75%, 100% {
                opacity: 0;
            }
        }

        @keyframes coinAnim {
            0%, 5% {
                transform: scale(1);
                opacity: 1;
            }
            12%, 42% {
                transform: scale(0);
                opacity: 0;
            }
            52%, 100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* === سایزها === */
        .wallet-loader.small { --size: 60px; }
        .wallet-loader.medium { --size: 120px; }
        .wallet-loader.large { --size: 180px; }

        /* === سرعت === */
        .wallet-loader.fast { --duration: 1.5s; }
        .wallet-loader.slow { --duration: 3.5s; }
    </style>
</head>

                            <stop offset="100%" stop-color="#F5A623"/>
                        </linearGradient>
                        <!-- سایه -->

                            <feDropShadow dx="1" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
                        </filter>
                        <!-- بلور -->
                        <filter id="blur1" x="-50%" y="-50%" width="200%" height="200%">
                            <feGaussianBlur stdDeviation="2"/>

                    </defs>

                        <!-- لایه رنگین‌کمان -->

                        </g>
                    </g>

                    <!-- نیمه راست -->
                    <g class="half-right">

                        <path d="M60 22 L78 22 C87 22 94 27 94 36 L94 84 C94 93 87 98 78 98 L60 98 Z"

                        <circle cx="60" cy="60" r="15" fill="#0a0a12"/>
                        <!-- لایه آبی -->

                            <path d="M60 22 L78 22 C87 22 94 27 94 36 L94 84 C94 93 87 98 78 98 L60 98 Z"

                            <circle cx="60" cy="60" r="15" fill="#0a0a12"/>
                        </g>
                    </g>

                    <!-- خط صورتی وسط -->
                    <line class="center-line" x1="60" y1="26" x2="60" y2="94"
                          stroke="#FF2D6A" stroke-width="2.5" stroke-linecap="round" filter="url(#blur1)"/>
                    <line class="center-line" x1="60" y1="26" x2="60" y2="94"
                          stroke="#FF6BA3" stroke-width="1.5" stroke-linecap="round"/>

                    <!-- سکه -->
                    <g class="coin-group">
                        <circle cx="60" cy="60" r="12" fill="url(#coinGrad1)" filter="url(#shadow1)"/>

                    </g>
                </svg>
            </div>
            <p>60px</p>
        </div>
