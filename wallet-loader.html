<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet Loader - Pure CSS/SVG Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #0f0f1a 100%);
            font-family: system-ui, -apple-system, sans-serif;
            gap: 40px;
        }

        h1 {
            color: #fff;
            font-weight: 300;
            font-size: 24px;
        }

        .demo-row {
            display: flex;
            gap: 60px;
            align-items: center;
        }

        .demo-box {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
        }

        .demo-box p {
            color: #666;
            margin-top: 20px;
            font-size: 13px;
        }

        /* ========================================
           WALLET LOADER - PURE CSS/SVG
           بدون هیچ تصویر خارجی
           ======================================== */

        .wallet-loader {
            --size: 120px;
            --duration: 1.4s;
            --primary: #3B82F6;
            --primary-dark: #1E40AF;
            --primary-light: #60A5FA;
            --coin: #F59E0B;
            --coin-light: #FBBF24;
            width: var(--size);
            height: var(--size);
            position: relative;
        }

        .wallet-loader svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        /* نیمه چپ کیف پول */
        .wallet-half-left {
            transform-origin: 60px 60px;
            animation: splitLeft var(--duration) ease-in-out infinite;
        }

        /* نیمه راست کیف پول */
        .wallet-half-right {
            transform-origin: 60px 60px;
            animation: splitRight var(--duration) ease-in-out infinite;
        }

        /* سکه */
        .wallet-coin {
            animation: coinPop var(--duration) ease-in-out infinite;
            transform-origin: 60px 60px;
        }

        /* اثر رنگین‌کمانی چپ */
        .rainbow-left {
            opacity: 0;
            animation: rainbowLeftAnim var(--duration) ease-in-out infinite;
            transform-origin: 60px 60px;
        }

        /* اثر رنگین‌کمانی راست */
        .rainbow-right {
            opacity: 0;
            animation: rainbowRightAnim var(--duration) ease-in-out infinite;
            transform-origin: 60px 60px;
        }

        /* خط نورانی وسط */
        .center-glow {
            opacity: 0;
            animation: centerGlowAnim var(--duration) ease-in-out infinite;
        }

        /* ذرات درخشان */
        .sparkle-particle {
            opacity: 0;
            animation: sparkleAnim var(--duration) ease-out infinite;
        }

        .sparkle-particle:nth-child(1) { animation-delay: 0.1s; }
        .sparkle-particle:nth-child(2) { animation-delay: 0.15s; }
        .sparkle-particle:nth-child(3) { animation-delay: 0.2s; }
        .sparkle-particle:nth-child(4) { animation-delay: 0.25s; }

        /* ========== KEYFRAMES ========== */

        @keyframes splitLeft {
            0%, 10% {
                transform: translateX(0) scale(1);
            }
            25%, 55% {
                transform: translateX(-12px) scale(1.02);
            }
            70%, 100% {
                transform: translateX(0) scale(1);
            }
        }

        @keyframes splitRight {
            0%, 10% {
                transform: translateX(0) scale(1);
            }
            25%, 55% {
                transform: translateX(12px) scale(1.02);
            }
            70%, 100% {
                transform: translateX(0) scale(1);
            }
        }

        @keyframes coinPop {
            0%, 10% {
                transform: scale(1) translateY(0);
            }
            25%, 35% {
                transform: scale(1.15) translateY(-3px);
            }
            55% {
                transform: scale(1.1) translateY(-2px);
            }
            70%, 100% {
                transform: scale(1) translateY(0);
            }
        }

        @keyframes rainbowLeftAnim {
            0%, 10% {
                opacity: 0;
                transform: translateX(0);
            }
            20%, 60% {
                opacity: 1;
                transform: translateX(-10px);
            }
            75%, 100% {
                opacity: 0;
                transform: translateX(0);
            }
        }

        @keyframes rainbowRightAnim {
            0%, 10% {
                opacity: 0;
                transform: translateX(0);
            }
            20%, 60% {
                opacity: 1;
                transform: translateX(10px);
            }
            75%, 100% {
                opacity: 0;
                transform: translateX(0);
            }
        }

        @keyframes centerGlowAnim {
            0%, 15% {
                opacity: 0;
            }
            25%, 55% {
                opacity: 1;
            }
            70%, 100% {
                opacity: 0;
            }
        }

        @keyframes sparkleAnim {
            0%, 15% {
                opacity: 0;
                transform: scale(0);
            }
            25% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.8;
                transform: scale(1.2);
            }
            65%, 100% {
                opacity: 0;
                transform: scale(0);
            }
        }

        /* ========== SIZE VARIANTS ========== */

        .wallet-loader.small {
            --size: 60px;
        }

        .wallet-loader.large {
            --size: 180px;
        }

        /* ========== SPEED VARIANTS ========== */

        .wallet-loader.fast {
            --duration: 0.9s;
        }

        .wallet-loader.slow {
            --duration: 2s;
        }
    </style>
</head>
<body>
    <h1>Wallet Loader Animation - Pure CSS/SVG</h1>

    <div class="demo-row">
        <!-- سایز کوچک -->
        <div class="demo-box">
            <div class="wallet-loader small">
                <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <!-- گرادیانت اصلی کیف پول -->
                        <linearGradient id="walletGradS" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#60A5FA"/>
                            <stop offset="50%" style="stop-color:#3B82F6"/>
                            <stop offset="100%" style="stop-color:#1E40AF"/>
                        </linearGradient>
                        <!-- گرادیانت سکه -->
                        <linearGradient id="coinGradS" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#FBBF24"/>
                            <stop offset="100%" style="stop-color:#F59E0B"/>
                        </linearGradient>
                        <!-- گرادیانت رنگین‌کمانی -->
                        <linearGradient id="rainbowGradLS" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" style="stop-color:#FF6B9D"/>
                            <stop offset="25%" style="stop-color:#C44AFF"/>
                            <stop offset="50%" style="stop-color:#44D7FF"/>
                            <stop offset="75%" style="stop-color:#44FF88"/>
                            <stop offset="100%" style="stop-color:#FFDD44"/>
                        </linearGradient>
                        <linearGradient id="rainbowGradRS" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" style="stop-color:#44FF88"/>
                            <stop offset="25%" style="stop-color:#44D7FF"/>
                            <stop offset="50%" style="stop-color:#C44AFF"/>
                            <stop offset="75%" style="stop-color:#FF6B9D"/>
                            <stop offset="100%" style="stop-color:#FFDD44"/>
                        </linearGradient>
                        <!-- فیلتر سایه -->
                        <filter id="shadowS" x="-20%" y="-20%" width="140%" height="140%">
                            <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#3B82F6" flood-opacity="0.3"/>
                        </filter>
                        <!-- فیلتر درخشش -->
                        <filter id="glowS" x="-50%" y="-50%" width="200%" height="200%">
                            <feGaussianBlur stdDeviation="3" result="blur"/>
                            <feMerge>
                                <feMergeNode in="blur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                    </defs>

                    <!-- نیمه چپ کیف پول -->
                    <g class="wallet-half-left" filter="url(#shadowS)">
                        <path d="M30 40 C30 34 34 30 40 30 L58 30 L58 90 L40 90 C34 90 30 86 30 80 Z" fill="url(#walletGradS)"/>
                        <path d="M30 45 C30 37 36 32 44 32 L55 32 L55 36 L44 36 C40 36 34 40 34 46 L34 74 C34 80 40 84 44 84 L55 84 L55 88 L44 88 C36 88 30 82 30 74 Z" fill="rgba(255,255,255,0.1)"/>
                    </g>

                    <!-- نیمه راست کیف پول -->
                    <g class="wallet-half-right" filter="url(#shadowS)">
                        <path d="M62 30 L80 30 C86 30 90 34 90 40 L90 80 C90 86 86 90 80 90 L62 90 Z" fill="url(#walletGradS)"/>
                        <!-- بریدگی نیم‌دایره -->
                        <circle cx="62" cy="60" r="12" fill="#0f0f1a"/>
                        <path d="M65 32 L76 32 C82 32 86 36 86 42 L86 78 C86 84 82 88 76 88 L65 88 L65 84 L74 84 C78 84 82 80 82 76 L82 44 C82 40 78 36 74 36 L65 36 Z" fill="rgba(255,255,255,0.1)"/>
                    </g>

                    <!-- اثر رنگین‌کمانی چپ -->
                    <g class="rainbow-left" filter="url(#glowS)">
                        <path d="M32 42 C32 36 36 32 42 32 L56 32 L56 88 L42 88 C36 88 32 84 32 78 Z" fill="url(#rainbowGradLS)" opacity="0.6"/>
                    </g>

                    <!-- اثر رنگین‌کمانی راست -->
                    <g class="rainbow-right" filter="url(#glowS)">
                        <path d="M64 32 L78 32 C84 32 88 36 88 42 L88 78 C88 84 84 88 78 88 L64 88 Z" fill="url(#rainbowGradRS)" opacity="0.6"/>
                    </g>

                    <!-- خط نورانی وسط -->
                    <g class="center-glow">
                        <line x1="60" y1="35" x2="60" y2="85" stroke="#FF6B9D" stroke-width="2" opacity="0.8"/>
                        <line x1="60" y1="35" x2="60" y2="85" stroke="#fff" stroke-width="1" opacity="0.5"/>
                    </g>

                    <!-- سکه -->
                    <g class="wallet-coin">
                        <circle cx="60" cy="60" r="10" fill="url(#coinGradS)" filter="url(#shadowS)"/>
                        <circle cx="58" cy="58" r="4" fill="rgba(255,255,255,0.3)"/>
                    </g>

                    <!-- ذرات درخشان -->
                    <circle class="sparkle-particle" cx="45" cy="45" r="2" fill="#fff"/>
                    <circle class="sparkle-particle" cx="75" cy="45" r="2" fill="#fff"/>
                    <circle class="sparkle-particle" cx="45" cy="75" r="2" fill="#fff"/>
                    <circle class="sparkle-particle" cx="75" cy="75" r="2" fill="#fff"/>
                </svg>
            </div>
            <p>60px - Small</p>
        </div>

        <!-- سایز متوسط (پیش‌فرض) -->
        <div class="demo-box">

                    </defs>

                    <g class="wallet-half-left" filter="url(#shadowM)">
                        <path d="M30 40 C30 34 34 30 40 30 L58 30 L58 90 L40 90 C34 90 30 86 30 80 Z" fill="url(#walletGradM)"/>
                        <path d="M30 45 C30 37 36 32 44 32 L55 32 L55 36 L44 36 C40 36 34 40 34 46 L34 74 C34 80 40 84 44 84 L55 84 L55 88 L44 88 C36 88 30 82 30 74 Z" fill="rgba(255,255,255,0.1)"/>
                    </g>

                    <g class="wallet-half-right" filter="url(#shadowM)">

                        <circle cx="62" cy="60" r="12" fill="#0f0f1a"/>
                        <path d="M65 32 L76 32 C82 32 86 36 86 42 L86 78 C86 84 82 88 76 88 L65 88 L65 84 L74 84 C78 84 82 80 82 76 L82 44 C82 40 78 36 74 36 L65 36 Z" fill="rgba(255,255,255,0.1)"/>
                    </g>

                    <g class="rainbow-left" filter="url(#glowM)">
                        <path d="M32 42 C32 36 36 32 42 32 L56 32 L56 88 L42 88 C36 88 32 84 32 78 Z" fill="url(#rainbowGradLM)" opacity="0.6"/>
                    </g>

                    <g class="rainbow-right" filter="url(#glowM)">
                        <path d="M64 32 L78 32 C84 32 88 36 88 42 L88 78 C88 84 84 88 78 88 L64 88 Z" fill="url(#rainbowGradRM)" opacity="0.6"/>
                    </g>

                    <g class="center-glow">
                        <line x1="60" y1="35" x2="60" y2="85" stroke="#FF6B9D" stroke-width="2" opacity="0.8"/>
                        <line x1="60" y1="35" x2="60" y2="85" stroke="#fff" stroke-width="1" opacity="0.5"/>
                    </g>

                    <g class="wallet-coin">
                        <circle cx="60" cy="60" r="10" fill="url(#coinGradM)" filter="url(#shadowM)"/>

                    </g>

                    <circle class="sparkle-particle" cx="45" cy="45" r="2" fill="#fff"/>
                    <circle class="sparkle-particle" cx="75" cy="45" r="2" fill="#fff"/>
                    <circle class="sparkle-particle" cx="45" cy="75" r="2" fill="#fff"/>
                    <circle class="sparkle-particle" cx="75" cy="75" r="2" fill="#fff"/>
                </svg>
            </div>
            <p>120px - Default</p>
        </div>

        <!-- سایز بزرگ -->
        <div class="demo-box">
            <div class="wallet-loader large">

    <div style="color: #444; font-size: 12px; margin-top: 20px;">
        100% Pure CSS/SVG - No Images - Lightweight

</body>
</html>
