<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet Loader - Frame by Frame</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #0a0a12;
            font-family: system-ui, sans-serif;
            gap: 30px;
        }
        h1 { color: #fff; font-weight: 300; font-size: 18px; }
        .demo-row { display: flex; gap: 40px; align-items: center; }
        .demo-box {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 30px;
            text-align: center;
        }
        .demo-box p { color: #555; margin-top: 15px; font-size: 12px; }
        canvas { display: block; }
        .info { color: #333; font-size: 11px; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Wallet Loader - Frame by Frame Animation (Pure Code)</h1>

    <div class="demo-row">
        <div class="demo-box">
            <canvas id="loader1" width="60" height="60"></canvas>
            <p>60px</p>
        </div>
        <div class="demo-box">
            <canvas id="loader2" width="120" height="120"></canvas>
            <p>120px</p>
        </div>
        <div class="demo-box">
            <canvas id="loader3" width="180" height="180"></canvas>
            <p>180px</p>
        </div>
    </div>

    <p class="info">35 Frames | 30 FPS | Pure Canvas - No Images</p>

    <script>
    /**
     * WalletLoader - Frame by Frame Animation
     * هر فریم جداگانه با کد رسم میشه - دقیقاً مثل Lottie اصلی
     */
    class WalletLoader {
        constructor(canvas, size = 120) {
            this.canvas = canvas;
            this.ctx = canvas.getContext('2d');
            this.size = size;
            this.scale = size / 120;
            this.frame = 0;
            this.totalFrames = 35;
            this.fps = 30;
            this.lastTime = 0;
            this.frameInterval = 1000 / this.fps;
            this.running = true;

            this.animate = this.animate.bind(this);
            requestAnimationFrame(this.animate);
        }

        animate(timestamp) {
            if (!this.running) return;

            if (timestamp - this.lastTime >= this.frameInterval) {
                this.lastTime = timestamp;
                this.drawFrame(this.frame);
                this.frame = (this.frame + 1) % this.totalFrames;
            }

            requestAnimationFrame(this.animate);
        }

        // ترسیم هر فریم بر اساس شماره فریم
        drawFrame(frameNum) {
            const ctx = this.ctx;
            const s = this.scale;

            ctx.clearRect(0, 0, this.size, this.size);
            ctx.save();
            ctx.scale(s, s);

            // بر اساس شماره فریم، وضعیت را تعیین و رسم کن
            if (frameNum <= 1) {
                this.drawNormalWallet();
            } else if (frameNum <= 3) {
                this.drawRainbowStart(frameNum - 2);
            } else if (frameNum <= 5) {
                this.drawRainbowFull(frameNum - 4);
            } else if (frameNum <= 8) {
                this.drawSeparating(frameNum - 6);
            } else if (frameNum <= 11) {
                this.drawRotating(frameNum - 9);
            } else if (frameNum <= 16) {
                this.drawClosing(frameNum - 12);
            } else if (frameNum <= 20) {
                this.drawSecondOpen(frameNum - 17);
            } else if (frameNum <= 24) {
                this.drawSecondClose(frameNum - 21);
            } else {
                this.drawNormalWallet();
            }

            ctx.restore();
        }

        // فریم 0-1: کیف پول آبی عادی با سکه
        drawNormalWallet() {
            this.drawWalletHalf('left', 0, 0, 1, 0);
            this.drawWalletHalf('right', 0, 0, 1, 0);
            this.drawNotch();
            this.drawCoin(1);
        }

        // فریم 2-3: شروع رنگین‌کمان
        drawRainbowStart(t) {
            const progress = t / 2;
            this.drawWalletHalf('left', 0, progress * 0.4, 1 - progress * 0.4, 0);
            this.drawWalletHalf('right', 0, progress * 0.4, 1 - progress * 0.4, 0);
            this.drawNotch();
            this.drawCoin(1 - progress * 0.5);
        }

        // فریم 4-5: رنگین‌کمان کامل روی کیف پول
        drawRainbowFull(t) {
            const progress = t / 2;
            const separation = progress * 8;
            this.drawWalletHalf('left', -separation, 0.4 + progress * 0.6, 0.6 - progress * 0.6, 0);
            this.drawWalletHalf('right', separation, 0.4 + progress * 0.6, 0.6 - progress * 0.6, 0);
            this.drawNotch();
            this.drawCoin(0.5 - progress * 0.5);
        }

        // فریم 6-8: جدا شدن دو نیمه
        drawSeparating(t) {
            const progress = t / 3;
            const separation = 8 + progress * 14;
            this.drawWalletHalf('left', -separation, 1, 0, progress * 4);
            this.drawWalletHalf('right', separation, 1, 0, progress * 4);
        }

        // فریم 9-11: چرخش نیمه راست
        drawRotating(t) {
            const progress = t / 3;
            const separation = 22 - progress * 8;
            const rotation = progress * 180;
            this.drawWalletHalf('left', -separation + progress * 5, 1 - progress * 0.3, progress * 0.3, 4 - progress * 2);
            this.drawWalletHalf('right', separation - progress * 5, 1 - progress * 0.3, progress * 0.3, 4 - progress * 2, rotation);
        }

        // فریم 12-16: بسته شدن و برگشت به آبی
        drawClosing(t) {
            const progress = t / 5;
            const separation = 14 - progress * 14;
            const rotation = 180 - progress * 180;
            this.drawWalletHalf('left', -separation, 0.7 - progress * 0.7, 0.3 + progress * 0.7, 2 - progress * 2);
            this.drawWalletHalf('right', separation, 0.7 - progress * 0.7, 0.3 + progress * 0.7, 2 - progress * 2, rotation);
            this.drawNotch();
            this.drawCoin(progress);
        }

        // فریم 17-20: باز شدن دوباره با خط صورتی
        drawSecondOpen(t) {
            const progress = t / 4;
            const separation = progress * 15;
            this.drawWalletHalf('left', -separation, 0, 1, 0);
            this.drawWalletHalf('right', separation, 0, 1, 0);
            this.drawNotch();
            this.drawCoin(1);
            this.drawPinkLine(progress);
        }

        // فریم 21-24: بسته شدن نهایی
        drawSecondClose(t) {
            const progress = t / 4;
            const separation = 15 - progress * 15;
            this.drawWalletHalf('left', -separation, 0, 1, 0);
            this.drawWalletHalf('right', separation, 0, 1, 0);
            this.drawNotch();
            this.drawCoin(1);
            this.drawPinkLine(1 - progress);
        }

        // رسم نیمه کیف پول
        drawWalletHalf(side, offsetX, rainbowOpacity, blueOpacity, blur, rotation = 0) {
            const ctx = this.ctx;
            const cx = 60;
            const cy = 60;
            const w = 32;
            const h = 38;
            const r = 10;

            ctx.save();
            ctx.translate(cx + offsetX, cy);
            if (rotation) ctx.rotate(rotation * Math.PI / 180);

            // سایه
            ctx.shadowColor = 'rgba(0,0,0,0.25)';
            ctx.shadowBlur = 6 + blur;
            ctx.shadowOffsetY = 3;

            // مسیر شکل
            ctx.beginPath();
            if (side === 'left') {
                ctx.moveTo(-w + r, -h);
                ctx.lineTo(0, -h);
                ctx.lineTo(0, h);
                ctx.lineTo(-w + r, h);
                ctx.quadraticCurveTo(-w, h, -w, h - r);
                ctx.lineTo(-w, -h + r);
                ctx.quadraticCurveTo(-w, -h, -w + r, -h);
            } else {
                ctx.moveTo(0, -h);
                ctx.lineTo(w - r, -h);
                ctx.quadraticCurveTo(w, -h, w, -h + r);
                ctx.lineTo(w, h - r);
                ctx.quadraticCurveTo(w, h, w - r, h);
                ctx.lineTo(0, h);
            }
            ctx.closePath();

            // رنگین‌کمان
            if (rainbowOpacity > 0) {
                const grad = ctx.createLinearGradient(0, h, 0, -h);
                grad.addColorStop(0, '#FF2D6A');
                grad.addColorStop(0.15, '#FF6B2D');
                grad.addColorStop(0.3, '#FFD02D');
                grad.addColorStop(0.5, '#2DFF6B');
                grad.addColorStop(0.7, '#2DD0FF');
                grad.addColorStop(0.85, '#6B2DFF');
                grad.addColorStop(1, '#FF2DD0');
                ctx.globalAlpha = rainbowOpacity;
                ctx.fillStyle = grad;
                ctx.fill();
            }

            // آبی
            if (blueOpacity > 0) {
                ctx.beginPath();
                if (side === 'left') {
                    ctx.moveTo(-w + r, -h);
                    ctx.lineTo(0, -h);
                    ctx.lineTo(0, h);
                    ctx.lineTo(-w + r, h);
                    ctx.quadraticCurveTo(-w, h, -w, h - r);
                    ctx.lineTo(-w, -h + r);
                    ctx.quadraticCurveTo(-w, -h, -w + r, -h);
                } else {
                    ctx.moveTo(0, -h);
                    ctx.lineTo(w - r, -h);
                    ctx.quadraticCurveTo(w, -h, w, -h + r);
                    ctx.lineTo(w, h - r);
                    ctx.quadraticCurveTo(w, h, w - r, h);
                    ctx.lineTo(0, h);
                }
                ctx.closePath();

                const blueGrad = ctx.createLinearGradient(-w, -h, w, h);
                blueGrad.addColorStop(0, '#6BA3F7');
                blueGrad.addColorStop(0.5, '#4A8AF5');
                blueGrad.addColorStop(1, '#3070E0');
                ctx.globalAlpha = blueOpacity;
                ctx.fillStyle = blueGrad;
                ctx.fill();

                // هایلایت فقط برای نیمه چپ
                if (side === 'left' && blueOpacity > 0.5) {
                    ctx.beginPath();
                    ctx.moveTo(-w + r + 2, -h + 4);
                    ctx.lineTo(-w + r + 10, -h + 4);
                    ctx.lineTo(-w + r + 10, -h + 14);
                    ctx.lineTo(-w + 4, -h + 14);
                    ctx.quadraticCurveTo(-w + 2, -h + 8, -w + r + 2, -h + 4);
                    ctx.closePath();
                    ctx.fillStyle = 'rgba(158, 202, 255, 0.5)';
                    ctx.globalAlpha = blueOpacity;
                    ctx.fill();
                }
            }

            ctx.restore();
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;
            ctx.shadowOffsetY = 0;
        }

        // رسم بریدگی سکه
        drawNotch() {
            const ctx = this.ctx;
            ctx.beginPath();
            ctx.arc(60, 60, 14, 0, Math.PI * 2);
            ctx.fillStyle = '#0a0a12';
            ctx.fill();
        }

        // رسم سکه
        drawCoin(scale) {
            if (scale <= 0) return;
            const ctx = this.ctx;

            ctx.save();
            ctx.translate(60, 60);
            ctx.scale(scale, scale);

            ctx.shadowColor = 'rgba(245, 166, 35, 0.4)';
            ctx.shadowBlur = 5;

            const grad = ctx.createRadialGradient(-2, -2, 0, 0, 0, 11);
            grad.addColorStop(0, '#FFD966');
            grad.addColorStop(1, '#F5A623');

            ctx.beginPath();
            ctx.arc(0, 0, 11, 0, Math.PI * 2);
            ctx.fillStyle = grad;
            ctx.fill();

            // هایلایت
            ctx.beginPath();
            ctx.ellipse(-3, -3, 4, 3, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            ctx.fill();

            ctx.restore();
        }

        // رسم خط صورتی وسط
        drawPinkLine(opacity) {
            if (opacity <= 0) return;
            const ctx = this.ctx;

            ctx.save();
            ctx.globalAlpha = opacity;
            ctx.strokeStyle = '#FF2D6A';
            ctx.lineWidth = 2.5;
            ctx.lineCap = 'round';
            ctx.shadowColor = '#FF2D6A';
            ctx.shadowBlur = 10;

            ctx.beginPath();
            ctx.moveTo(60, 25);
            ctx.lineTo(60, 95);
            ctx.stroke();

            ctx.restore();
        }
    }

    // ایجاد لودرها
    new WalletLoader(document.getElementById('loader1'), 60);
    new WalletLoader(document.getElementById('loader2'), 120);
    new WalletLoader(document.getElementById('loader3'), 180);
    </script>
</body>
</html>
