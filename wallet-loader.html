<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet - Frame 1</title>
    <style>
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fff;
            margin: 0;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="wallet" width="120" height="120"></canvas>

    <script>
    const canvas = document.getElementById('wallet');
    const ctx = canvas.getContext('2d');

    // مرکز
    const cx = 60;
    const cy = 60;

    // ابعاد کیف پول
    const width = 58;
    const height = 68;
    const cornerRadius = 14;
    const notchRadius = 14;

    // سایه
    ctx.shadowColor = 'rgba(0, 0, 0, 0.15)';
    ctx.shadowBlur = 8;
    ctx.shadowOffsetX = 2;
    ctx.shadowOffsetY = 4;

    // رسم شکل کیف پول (مستطیل با گوشه گرد + بریدگی نیم‌دایره)
    ctx.beginPath();

    // شروع از بالا چپ
    ctx.moveTo(cx - width/2 + cornerRadius, cy - height/2);

    // خط بالا
    ctx.lineTo(cx + width/2 - cornerRadius, cy - height/2);

    // گوشه بالا راست
    ctx.arcTo(cx + width/2, cy - height/2, cx + width/2, cy - height/2 + cornerRadius, cornerRadius);

    // خط راست تا بریدگی
    ctx.lineTo(cx + width/2, cy - notchRadius);

    // بریدگی نیم‌دایره (به سمت داخل)
    ctx.arc(cx + width/2, cy, notchRadius, -Math.PI/2, Math.PI/2, true);

    // خط راست بعد از بریدگی
    ctx.lineTo(cx + width/2, cy + height/2 - cornerRadius);

    // گوشه پایین راست
    ctx.arcTo(cx + width/2, cy + height/2, cx + width/2 - cornerRadius, cy + height/2, cornerRadius);

    // خط پایین
    ctx.lineTo(cx - width/2 + cornerRadius, cy + height/2);

    // گوشه پایین چپ
    ctx.arcTo(cx - width/2, cy + height/2, cx - width/2, cy + height/2 - cornerRadius, cornerRadius);

    // خط چپ
    ctx.lineTo(cx - width/2, cy - height/2 + cornerRadius);

    // گوشه بالا چپ
    ctx.arcTo(cx - width/2, cy - height/2, cx - width/2 + cornerRadius, cy - height/2, cornerRadius);

    ctx.closePath();

    // گرادیانت آبی
    const blueGrad = ctx.createLinearGradient(cx - width/2, cy - height/2, cx + width/2, cy + height/2);
    blueGrad.addColorStop(0, '#5294F5');
    blueGrad.addColorStop(0.5, '#4285F4');
    blueGrad.addColorStop(1, '#3275E4');

    ctx.fillStyle = blueGrad;
    ctx.fill();

    // هایلایت گوشه بالا چپ
    ctx.shadowColor = 'transparent';
    ctx.beginPath();
    ctx.moveTo(cx - width/2 + cornerRadius - 2, cy - height/2 + 4);
    ctx.lineTo(cx - width/2 + cornerRadius + 14, cy - height/2 + 4);
    ctx.lineTo(cx - width/2 + cornerRadius + 14, cy - height/2 + 16);
    ctx.lineTo(cx - width/2 + 6, cy - height/2 + 16);
    ctx.quadraticCurveTo(cx - width/2 + 4, cy - height/2 + 10, cx - width/2 + cornerRadius - 2, cy - height/2 + 4);
    ctx.closePath();

    ctx.fillStyle = 'rgba(130, 190, 255, 0.55)';
    ctx.fill();

    // سکه
    ctx.shadowColor = 'rgba(245, 180, 0, 0.4)';
    ctx.shadowBlur = 5;
    ctx.shadowOffsetX = 0;
    ctx.shadowOffsetY = 2;

    const coinGrad = ctx.createRadialGradient(cx + width/2 - 3, cy - 3, 0, cx + width/2, cy, 12);
    coinGrad.addColorStop(0, '#FFE55C');
    coinGrad.addColorStop(0.6, '#FBBC05');
    coinGrad.addColorStop(1, '#E5A800');

    ctx.beginPath();
    ctx.arc(cx + width/2, cy, 11, 0, Math.PI * 2);
    ctx.fillStyle = coinGrad;
    ctx.fill();

    // هایلایت سکه
    ctx.shadowColor = 'transparent';
    ctx.beginPath();
    ctx.ellipse(cx + width/2 - 3, cy - 3, 4, 3, -0.4, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
    ctx.fill();
    </script>
</body>
</html>
