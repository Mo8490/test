<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet - Frame 1</title>
    <style>
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fff;
            margin: 0;
        }
    </style>
</head>
<body>
    <canvas id="wallet" width="120" height="120"></canvas>

    <script>
    const canvas = document.getElementById('wallet');
    const ctx = canvas.getContext('2d');

    // ابعاد دقیق از فریم اصلی
    const cx = 60;  // مرکز X
    const cy = 60;  // مرکز Y

    // شکل C - ابعاد دقیق
    const left = 25;        // لبه چپ
    const right = 95;       // لبه راست
    const top = 22;         // لبه بالا
    const bottom = 98;      // لبه پایین
    const cornerR = 16;     // شعاع گوشه‌ها
    const notchR = 15;      // شعاع بریدگی سکه
    const notchX = right;   // مرکز X بریدگی (لبه راست)
    const notchY = cy;      // مرکز Y بریدگی (وسط)

    // === رسم سایه ===
    ctx.shadowColor = 'rgba(30, 60, 120, 0.25)';
    ctx.shadowBlur = 12;
    ctx.shadowOffsetX = 2;
    ctx.shadowOffsetY = 6;

    // === رسم شکل C ===
    ctx.beginPath();

    // شروع از گوشه بالا چپ (بعد از منحنی)
    ctx.moveTo(left + cornerR, top);

    // لبه بالا → گوشه بالا راست
    ctx.lineTo(right - cornerR, top);
    ctx.arcTo(right, top, right, top + cornerR, cornerR);

    // لبه راست بالا → تا بریدگی
    ctx.lineTo(right, notchY - notchR);

    // بریدگی نیم‌دایره (به سمت چپ/داخل)
    ctx.arc(notchX, notchY, notchR, -Math.PI/2, Math.PI/2, true);

    // لبه راست پایین → گوشه پایین راست
    ctx.lineTo(right, bottom - cornerR);
    ctx.arcTo(right, bottom, right - cornerR, bottom, cornerR);

    // لبه پایین → گوشه پایین چپ
    ctx.lineTo(left + cornerR, bottom);
    ctx.arcTo(left, bottom, left, bottom - cornerR, cornerR);

    // لبه چپ → گوشه بالا چپ
    ctx.lineTo(left, top + cornerR);
    ctx.arcTo(left, top, left + cornerR, top, cornerR);

    ctx.closePath();

    // گرادیانت آبی (از بالا-چپ روشن به پایین-راست تیره)
    const grad = ctx.createLinearGradient(left, top, right, bottom);
    grad.addColorStop(0, '#5A9CF8');    // آبی روشن
    grad.addColorStop(0.4, '#4A8DF5');  // آبی متوسط
    grad.addColorStop(1, '#3B7DE8');    // آبی تیره

    ctx.fillStyle = grad;
    ctx.fill();

    // === هایلایت گوشه بالا چپ ===
    ctx.shadowColor = 'transparent';

    ctx.beginPath();
    ctx.moveTo(left + 4, top + cornerR);
    ctx.lineTo(left + 4, top + 6);
    ctx.arcTo(left + 4, top + 4, left + 6, top + 4, 2);
    ctx.lineTo(left + cornerR + 12, top + 4);
    ctx.lineTo(left + cornerR + 12, top + 6);
    ctx.lineTo(left + cornerR + 8, top + 18);
    ctx.lineTo(left + 8, top + 18);
    ctx.arcTo(left + 4, top + 14, left + 4, top + cornerR, 6);
    ctx.closePath();

    const highlightGrad = ctx.createLinearGradient(left, top, left + 30, top + 25);
    highlightGrad.addColorStop(0, 'rgba(160, 200, 255, 0.7)');
    highlightGrad.addColorStop(1, 'rgba(100, 160, 255, 0)');

    ctx.fillStyle = highlightGrad;
    ctx.fill();

    // === سکه ===
    const coinX = notchX;
    const coinY = notchY;
    const coinR = 12;

    // سایه سکه
    ctx.shadowColor = 'rgba(200, 150, 0, 0.35)';
    ctx.shadowBlur = 6;
    ctx.shadowOffsetX = 0;
    ctx.shadowOffsetY = 2;

    // گرادیانت سکه
    const coinGrad = ctx.createRadialGradient(
        coinX - 3, coinY - 3, 0,
        coinX, coinY, coinR
    );
    coinGrad.addColorStop(0, '#FFE566');   // زرد روشن
    coinGrad.addColorStop(0.5, '#FFCC33'); // نارنجی-زرد
    coinGrad.addColorStop(1, '#F5A623');   // نارنجی

    ctx.beginPath();
    ctx.arc(coinX, coinY, coinR, 0, Math.PI * 2);
    ctx.fillStyle = coinGrad;
    ctx.fill();

    // هایلایت سکه
    ctx.shadowColor = 'transparent';
    ctx.beginPath();
    ctx.ellipse(coinX - 4, coinY - 4, 5, 3.5, -0.5, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
    ctx.fill();
    </script>
</body>
</html>
