<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9-Frame Loaders - سایزهای مختلف</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: #0a0a1a;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            color: #e0e0e0;
            padding: 30px;
        }
        h1 { text-align: center; color: #00d4ff; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 40px; }
        
        .loaders-row {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-end;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .loader-box {
            background: #12122a;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
        }
        .loader-box.best {
            border: 2px solid #00ff88;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.3);
        }
        .loader-label { color: #00d4ff; font-size: 1.3rem; font-weight: bold; }
        .loader-info { color: #666; font-size: 0.8rem; margin: 5px 0 15px; }
        .loader-size { 
            color: #00ff88; 
            font-size: 1.8rem; 
            font-weight: bold; 
            margin-top: 15px;
        }
        
        .preview-area {
            background: #000;
            border-radius: 12px;
            margin: 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .copy-btn {
            margin-top: 10px;
            padding: 10px 20px;
            background: #00d4ff;
            color: #000;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .copy-btn:hover { background: #00b8e6; }
        
        .note {
            max-width: 600px;
            margin: 40px auto;
            background: #1a1a3a;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            color: #888;
        }
        .note span { color: #00ff88; font-weight: bold; }
