<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لودرهای 14 فریم - روان‌تر</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: #0a0a1a;
            font-family: 'Segoe UI', sans-serif;
            color: #e0e0e0;
            padding: 30px;
        }
        h1 { text-align: center; color: #00d4ff; margin-bottom: 10px; }
        .sub { text-align: center; color: #888; margin-bottom: 30px; }
        .sub b { color: #00ff88; }
        
        .speed-box {
            max-width: 400px;
            margin: 0 auto 35px;
            background: #12122a;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
        }
        .speed-val { color: #00ff88; font-size: 2rem; font-weight: bold; margin: 10px 0; }
        .slider {
            width: 100%;
            height: 8px;
            -webkit-appearance: none;
            background: #333;
            border-radius: 4px;
            outline: none;
        }
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: #00ff88;
            border-radius: 50%;
            cursor: pointer;
        }
        .presets {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 12px;
        }
        .preset {
            padding: 6px 14px;
            background: transparent;
            border: 1px solid #444;
            color: #888;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .preset:hover { border-color: #00d4ff; color: #00d4ff; }
        .preset.on { background: #00d4ff; color: #000; border-color: #00d4ff; }
        
        .grid {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            justify-content: center;
            align-items: flex-end;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .card {
            background: #12122a;
            border-radius: 14px;
            padding: 16px;
            text-align: center;
        }
        .sz { color: #00d4ff; font-size: 1.4rem; font-weight: bold; }
        .info { color: #666; font-size: 0.75rem; margin: 4px 0 10px; }
        .kb { color: #00ff88; font-size: 1.1rem; font-weight: bold; margin-top: 10px; }
        
        .pv {
            background: #000;
            border-radius: 10px;
            margin: 8px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .btn {
            margin-top: 8px;
            padding: 7px 14px;
            background: #00d4ff;
            color: #000;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8rem;
        }
        .btn:hover { background: #00ff88; }

        const sl = document.getElementById('sl');
        const sv = document.getElementById('sv');
        
        function sp(v) {
            sl.value = v;
            upd();
            document.querySelectorAll('.preset').forEach(b => {
                b.classList.toggle('on', parseFloat(b.textContent) === v);
            });
        }
        
        function upd() {
            const v = parseFloat(sl.value);
            sv.textContent = v.toFixed(1);
            document.documentElement.style.setProperty('--spd', v + 's');
        }
        
        sl.addEventListener('input', () => {
            upd();
            document.querySelectorAll('.preset').forEach(b => b.classList.remove('on'));
        });
        
        function cp(size, sw) {
            const v = parseFloat(sl.value);
            const css = `.wallet-loader {
    width: ${size}px;
    height: ${size}px;
    background-image: url("${data[size]}");
    background-size: 1400% 100%;
    animation: wallet-sprite ${v}s steps(14) infinite;
}

@keyframes wallet-sprite {
    to { background-position: -${sw}px 0; }
}`;
            navigator.clipboard.writeText(css).then(() => alert('✅ کپی شد!'));
        }
        
        upd();
    </script>
